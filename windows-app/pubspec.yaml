name: mirrorlink_windows
description: >-
  Windows host for MirrorLink. Pair with an Android phone over Wi-Fi to view
  and control it, transfer files, and sync the clipboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_webrtc: ^1.6.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  file_picker: ^8.0.3
  window_manager: ^0.4.0
  image: ^4.1.3
  video_player: ^2.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
