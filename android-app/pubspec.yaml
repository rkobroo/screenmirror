name: mirrorlink_android
description: >-
  Wirelessly view and control your Android phone from a Windows PC over your
  local Wi-Fi: screen mirroring, remote control, file transfer, clipboard sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.0
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
