plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty("flutter.sdk")
if (flutterRoot == null) {
    throw new GradleException(
        "Flutter SDK not found. Define settings with flutter config.\n" +
        "This file is normally generated by the Flutter tool.")
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.mirrorlink.android"
    compileSdk 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.mirrorlink.android"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // Build a fat APK plus one per-CPU-architecture APK. Native libs (WebRTC +
    // Flutter engine) dominate size, so splitting keeps the phone downloads
    // small (~31 MB arm64 instead of a 92 MB universal APK).
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Native WebRTC SDK (MediaProjection capture + peer connection + data channels).
    implementation "io.github.webrtc-sdk:android:125.6422.07"
}
