name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------ Android APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: android-app
        run: |
          flutter build apk --release > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::group::Android build failed"
            tail -n 60 build.log
            echo "::endgroup::"
          fi
          exit $code

      - name: Surface build failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'android-app/build.log';
            let tail = '';
            try {
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              tail = lines.slice(-15).join('\n').trim();
            } catch (e) { tail = '(no build.log)'; }
            if (tail) core.error(tail);
            const statusMsg = tail.replace(/\s+/g, ' ').slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'android-build',
              description: statusMsg,
            });

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-app/build.log
          if-no-files-found: ignore

      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          cp android-app/build/app/outputs/flutter-apk/app-*.apk dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ------------------------------------------------ Windows EXE
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        working-directory: windows-app
        run: flutter create --platforms windows --project-name mirrorlink_windows --org com.mirrorlink .

      - name: Build release EXE
        working-directory: windows-app
        run: flutter build windows --release

      - name: Code-sign the EXE (if certificate configured)
        env:
          CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:CODE_SIGNING_CERT) {
            Write-Host 'No CODE_SIGNING_CERT secret configured; skipping code signing.'
            exit 0
          }
          $exe = Get-ChildItem -Path windows-app/build/windows/x64/runner/Release/*.exe |
              Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_CERT))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse `
              -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found (install Windows SDK)' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CODE_SIGNING_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 /v $exe.FullName

      - name: Collect Windows release bundle
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path windows-app/build/windows/x64/runner/Release/* -DestinationPath dist/MirrorLink-Windows.zip
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/MirrorLink-Windows.zip
          if-no-files-found: error

  # ------------------------------------------------ GitHub Release (tags only)
  release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MirrorLink ${{ github.ref_name }}
          body: |
            Automated build of ${{ github.ref_name }}.

            ## Download
            - **Android** — pick the APK for your phone:
              - `app-arm64-v8a-release.apk` — most modern phones (smallest, ~31 MB)
              - `app-armeabi-v7a-release.apk` — older 32-bit phones (~23 MB)
              - `app-x86_64-release.apk` — emulators only
              - `app-universal-release.apk` — all ABIs in one (largest, use if unsure)
            - **Windows** — extract `MirrorLink-Windows.zip` and run `mirrorlink_windows.exe`.

            ## Features
            - Screen mirroring (WebRTC, low latency)
            - Remote touch/keyboard control
            - File transfer (drag & drop)
            - Clipboard sync
            - No accounts, no cloud servers
          draft: false
          prerelease: false
          files: release/*
